name: Weekly Scrape

on:
  schedule:
    # Run at 18:00 UTC every Monday
    - cron: '0 18 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python bordshockey_scraper.py

      - name: Refresh Scorpion player data
        run: curl -fsSL -o players_data.csv https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/players_data.csv
        continue-on-error: true

      - name: Fetch player ids from the resultat API
        run: python fetch_api_player_ids.py
        continue-on-error: true

      - name: Run Player Mapping
        run: python map_players.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: weekly data update"
          file_pattern: "bordshockey_results.csv player_id_map.csv player_entry_map.csv api_player_ids.csv players_data.csv unmapped_players.csv manual_mapping.json"
