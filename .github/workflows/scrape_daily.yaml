name: Daily Scrape

on:
  schedule:
    # Run at 18:00 UTC every day
    - cron: '0 18 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch results from the resultat API
        run: python resultat_api_scraper.py

      - name: Refresh Scorpion player data
        run: curl -fsSL -o players_data.csv https://raw.githubusercontent.com/amundfylling/Scorpion-Scraper-2.0/main/data/players_data.csv
        continue-on-error: true

      - name: Fetch player ids from the resultat API
        run: python fetch_api_player_ids.py
        continue-on-error: true

      - name: Run Player Mapping
        run: python map_players.py

      - name: Commit and push changes
        # The branch can move while the fetch runs, so rebase onto it before pushing.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bordshockey_results.parquet player_id_map.csv player_entry_map.csv api_player_ids.csv players_data.csv unmapped_players.csv manual_mapping.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: daily data update"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
