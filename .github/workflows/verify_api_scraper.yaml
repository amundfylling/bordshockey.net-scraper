name: Verify API scraper (temporary)

on:
  push:
    branches: ['claude/project-thread-tehubj']

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Fetch overlapping tournaments from the API
        run: python resultat_api_scraper.py --rebuild --only-from bordshockey_results.csv --csv /tmp/api_results.csv
      - name: Compare with the HTML scraper's CSV
        run: python compare_results.py bordshockey_results.csv /tmp/api_results.csv
